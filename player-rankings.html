<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Apocalyptia Esports</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Header Container -->
  <div id="header-placeholder"></div>

  <!-- Backdrop overlay when drawer is open -->
  <div id="nav-overlay" class="nav-overlay"></div>

  <main>
    <section class="banner">
      <div class="section-content">
        <span class="sub-heading">CS2 Roster Leaderboard</span>
        <h2>Player Rankings</h2>
        <p>Top individual players representing Apocalyptia in Counter-Strike 2.</p>
      </div>
    </section>

    <section class="page-section">
      <div class="section-content">
        
        <!-- Search, Filter & Sort Controls -->
        <div class="search-container">
          <input 
            type="text" 
            id="player-search" 
            class="search-input" 
            placeholder="Search player name or team..."
          >
          
          <!-- Role Filter Dropdown -->
          <select id="role-select" class="search-select">
            <option value="">All Roles</option>
            <option value="IGL">IGL</option>
            <option value="Awper">Awper</option>
            <option value="Entry Fragger">Entry Fragger</option>
            <option value="Rifler">Rifler</option>
            <option value="Support">Support</option>
            <option value="Lurker">Lurker</option>
            <option value="Anchor">Anchor</option>
          </select>

          <!-- Sort Select Dropdown -->
          <select id="sort-select" class="search-select">
            <option value="rank-asc">Rank: High to Low (#1 → #35)</option>
            <option value="rank-desc">Rank: Low to High (#35 → #1)</option>
            <option value="rating-desc">Rating: Highest First</option>
            <option value="rating-asc">Rating: Lowest First</option>
            <option value="name-asc">Name: A to Z</option>
            <option value="name-desc">Name: Z to A</option>
            <option value="age-asc">Age: Youngest First</option>
            <option value="age-desc">Age: Oldest First</option>
          </select>

          <button id="clear-search" class="btn-clear" style="display: none;">Clear</button>
        </div>

        <!-- Target Container for Dynamic Cards -->
        <div id="player-list" class="player-list"></div>

      </div>
    </section>
  </main>

  <div id="footer-placeholder"></div>

  <!-- Scripts -->
  <script src="cookies.js"></script>
  <script src="players.js"></script>
  <script>
    const container = document.getElementById('player-list');
    const searchInput = document.getElementById('player-search');
    const roleSelect = document.getElementById('role-select');
    const sortSelect = document.getElementById('sort-select');
    const clearBtn = document.getElementById('clear-search');

    // Helper function to handle sorting on an array
    function sortPlayerData(data, sortKey) {
      const [property, direction] = sortKey.split('-');
      
      return [...data].sort((a, b) => {
        let valA = a[property];
        let valB = b[property];

        // Parse numerical values if sorting by rank, rating, or age
        if (property === 'rank' || property === 'rating' || property === 'age') {
          valA = parseFloat(valA);
          valB = parseFloat(valB);
        } else if (typeof valA === 'string') {
          valA = valA.toLowerCase();
          valB = valB.toLowerCase();
        }

        if (direction === 'asc') {
          return valA > valB ? 1 : valA < valB ? -1 : 0;
        } else {
          return valA < valB ? 1 : valA > valB ? -1 : 0;
        }
      });
    }

    function renderPlayers(textQuery = '', roleQuery = '', sortQuery = 'rank-asc') {
      container.innerHTML = '';

      // 1. Filter dataset
      const filtered = playersData.filter(player => {
        const textMatch = 
          player.name.toLowerCase().includes(textQuery.toLowerCase()) ||
          player.teamName.toLowerCase().includes(textQuery.toLowerCase());

        const roleMatch = roleQuery === '' || 
          player.role.toLowerCase().includes(roleQuery.toLowerCase());

        return textMatch && roleMatch;
      });

      if (filtered.length === 0) {
        container.innerHTML = `<p style="color: #a0a0b0; text-align: center; margin-top: 2rem;">No players found matching your filters.</p>`;
        return;
      }

      // 2. Sort filtered dataset
      const sorted = sortPlayerData(filtered, sortQuery);

      // 3. Render DOM cards
      sorted.forEach(player => {
        const card = document.createElement('div');
        card.className = 'player-card';

        card.innerHTML = `
          <div class="card-rank">#${player.rank}</div>
          <div class="card-avatar">
            <img src="${player.avatar}" alt="${player.name} Avatar">
          </div>
          <div class="card-details">
            <a href="player.html?id=${player.id}" class="player-name">${player.name}</a>
            <span class="player-role">${player.role}</span>
          </div>
          <div class="card-team">
            <span class="team-label">Team</span>
            <a href="${player.teamUrl}" class="team-name">${player.teamName}</a>
          </div>
          <div class="card-action">
            <a href="player.html?id=${player.id}" class="btn-sm">View Profile</a>
          </div>
        `;
        container.appendChild(card);
      });
    }

    function updateFiltersAndCookies() {
      const textQuery = searchInput.value.trim();
      const roleQuery = roleSelect.value;
      const sortQuery = sortSelect.value;

      // Persist preferences in cookies
      setCookie('playerSearchQuery', textQuery, 30);
      setCookie('playerRoleQuery', roleQuery, 30);
      setCookie('playerSortQuery', sortQuery, 30);

      // Show/hide clear button
      clearBtn.style.display = (textQuery || roleQuery || sortQuery !== 'rank-asc') ? 'inline-block' : 'none';

      renderPlayers(textQuery, roleQuery, sortQuery);
    }

    // Load filter and sort preferences from cookies on page load
    const savedText = getCookie('playerSearchQuery');
    const savedRole = getCookie('playerRoleQuery');
    const savedSort = getCookie('playerSortQuery');

    if (savedText) searchInput.value = savedText;
    if (savedRole) roleSelect.value = savedRole;
    if (savedSort) sortSelect.value = savedSort;

    if (savedText || savedRole || (savedSort && savedSort !== 'rank-asc')) {
      clearBtn.style.display = 'inline-block';
    }

    renderPlayers(searchInput.value.trim(), roleSelect.value, sortSelect.value);

    // Event Listeners
    searchInput.addEventListener('input', updateFiltersAndCookies);
    roleSelect.addEventListener('change', updateFiltersAndCookies);
    sortSelect.addEventListener('change', updateFiltersAndCookies);

    // Clear filters and reset sort
    clearBtn.addEventListener('click', () => {
      searchInput.value = '';
      roleSelect.value = '';
      sortSelect.value = 'rank-asc';
      setCookie('playerSearchQuery', '', -1);
      setCookie('playerRoleQuery', '', -1);
      setCookie('playerSortQuery', '', -1);
      clearBtn.style.display = 'none';
      renderPlayers();
    });
  </script>
  
  <!-- Global Scripts -->
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="layout.js"></script>
  <script src="nav.js"></script>
</body>
</html>
