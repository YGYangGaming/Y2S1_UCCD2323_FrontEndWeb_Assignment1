<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Apocalyptia Esports</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Header Container -->
  <div id="header-placeholder"></div>

  <!-- Backdrop overlay when drawer is open -->
  <div id="nav-overlay" class="nav-overlay"></div>

  <main>
    <section class="banner">
      <div class="section-content">
        <span class="sub-heading">CS2 Club Rosters</span>
        <h2>Team Rankings</h2>
        <p>Official Counter-Strike 2 teams competing under the Apocalyptia banner.</p>
      </div>
    </section>

    <section class="page-section">
      <div class="section-content">
        
        <!-- Search, Filter & Sort Controls -->
        <div class="search-container">
          <input 
            type="text" 
            id="team-search" 
            class="search-input" 
            placeholder="Search team by name..."
          >
          
          <!-- Sort Select Dropdown -->
          <select id="team-sort-select" class="search-select">
            <option value="rank-asc">Rank: High to Low (#1 → Bottom)</option>
            <option value="rank-desc">Rank: Low to High (Bottom → #1)</option>
            <option value="name-asc">Name: A to Z</option>
            <option value="name-desc">Name: Z to A</option>
          </select>

          <button id="clear-team-search" class="btn-clear" style="display: none;">Clear</button>
        </div>

        <div id="team-list" class="team-list"></div>

      </div>
    </section>
  </main>

  <div id="footer-placeholder"></div>

  <!-- Scripts -->
  <script src="cookies.js"></script>
  <script src="teams.js"></script>
  <script>
    const container = document.getElementById('team-list');
    const searchInput = document.getElementById('team-search');
    const sortSelect = document.getElementById('team-sort-select');
    const clearBtn = document.getElementById('clear-team-search');

    // Helper function to handle sorting on teams array
    function sortTeamData(data, sortKey) {
      const [property, direction] = sortKey.split('-');

      return [...data].sort((a, b) => {
        let valA = a[property];
        let valB = b[property];

        if (property === 'rank') {
          valA = parseFloat(valA);
          valB = parseFloat(valB);
        } else if (typeof valA === 'string') {
          valA = valA.toLowerCase();
          valB = valB.toLowerCase();
        }

        if (direction === 'asc') {
          return valA > valB ? 1 : valA < valB ? -1 : 0;
        } else {
          return valA < valB ? 1 : valA > valB ? -1 : 0;
        }
      });
    }

    function renderTeams(filterText = '', sortKey = 'rank-asc') {
      container.innerHTML = '';

      // 1. Filter dataset
      const filtered = teamsData.filter(team => 
        team.name.toLowerCase().includes(filterText.toLowerCase())
      );

      if (filtered.length === 0) {
        container.innerHTML = `<p style="color: #a0a0b0; text-align: center; margin-top: 2rem;">No teams found matching "${filterText}"</p>`;
        return;
      }

      // 2. Sort dataset
      const sorted = sortTeamData(filtered, sortKey);

      // 3. Render DOM cards
      sorted.forEach(team => {
        const card = document.createElement('div');
        card.className = 'team-card';

        card.innerHTML = `
          <div class="card-rank">#${team.rank}</div>
          <div class="card-avatar">
            <img src="${team.logo}" alt="${team.name} Logo">
          </div>
          <div class="card-details">
            <a href="team.html?id=${team.id}" class="team-card-title">${team.name}</a>
          </div>
          <div class="card-action">
            <a href="team.html?id=${team.id}" class="btn-sm">View Team</a>
          </div>
        `;
        container.appendChild(card);
      });
    }

    function updateFiltersAndCookies() {
      const query = searchInput.value.trim();
      const sortQuery = sortSelect.value;

      // Save preferences in cookies
      setCookie('teamSearchQuery', query, 30);
      setCookie('teamSortQuery', sortQuery, 30);

      // Show/hide clear button
      clearBtn.style.display = (query || sortQuery !== 'rank-asc') ? 'inline-block' : 'none';

      renderTeams(query, sortQuery);
    }

    // Load filter and sort preferences from Cookies on page load
    const savedFilter = getCookie('teamSearchQuery');
    const savedSort = getCookie('teamSortQuery');

    if (savedFilter) searchInput.value = savedFilter;
    if (savedSort) sortSelect.value = savedSort;

    if (savedFilter || (savedSort && savedSort !== 'rank-asc')) {
      clearBtn.style.display = 'inline-block';
    }

    renderTeams(searchInput.value.trim(), sortSelect.value);

    // Event Listeners
    searchInput.addEventListener('input', updateFiltersAndCookies);
    sortSelect.addEventListener('change', updateFiltersAndCookies);

    // Clear search filter & reset sort
    clearBtn.addEventListener('click', () => {
      searchInput.value = '';
      sortSelect.value = 'rank-asc';
      setCookie('teamSearchQuery', '', -1);
      setCookie('teamSortQuery', '', -1);
      clearBtn.style.display = 'none';
      renderTeams();
    });
  </script>
  
  <!-- Global Scripts -->
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="layout.js"></script>
  <script src="nav.js"></script>
</body>
</html>
