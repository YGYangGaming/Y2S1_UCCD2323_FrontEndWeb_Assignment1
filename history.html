<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Viewing History - Apocalyptia</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .history-tabs {
      display: flex;
      justify-content: center;
      gap: 1rem;
      margin-bottom: 2rem;
    }
    .history-card-list {
      display: flex;
      flex-direction: column;
      gap: 1rem;
      max-width: 800px;
      margin: 0 auto;
    }
    .history-item {
      background-color: #121216;
      border: 1px solid #262630;
      border-left: 4px solid #ff6600;
      border-radius: 6px;
      padding: 1rem 1.5rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .history-item-info h3 {
      color: #ffffff;
      font-size: 1.1rem;
      margin-bottom: 0.25rem;
    }
    .history-badge {
      display: inline-block;
      padding: 0.2rem 0.6rem;
      border-radius: 4px;
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      background-color: #262630;
      color: #ff6600;
      margin-right: 0.5rem;
    }
    .history-time {
      color: #a0a0b0;
      font-size: 0.85rem;
    }
    .empty-msg {
      color: #666677;
      font-style: italic;
      padding: 2rem 0;
    }
  </style>
</head>
<body>

  <div id="header-placeholder"></div>
  <div id="nav-overlay" class="nav-overlay"></div>

  <main>
    <section class="banner">
      <div class="section-content">
        <span class="sub-heading">Activity Log</span>
        <h2>Viewing History</h2>
        <p>Review the player profiles, team rosters, and events you have checked out.</p>
      </div>
    </section>

    <section class="page-section">
      <div class="section-content">
        <!-- Storage Switcher Tabs -->
        <div class="history-tabs">
          <button id="btn-local" class="btn">All-Time (Local)</button>
          <button id="btn-session" class="btn-sm">Current Session</button>
          <button id="btn-clear" class="btn-clear">Clear History</button>
        </div>

        <!-- Dynamic Container -->
        <div id="history-container" class="history-card-list"></div>
      </div>
    </section>
  </main>

  <div id="footer-placeholder"></div>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="layout.js"></script>
  <script src="nav.js"></script>
  <script>
    let activeMode = 'local';

    function renderHistory() {
      const storageKey = activeMode === 'local' ? 'apocalyptia_history' : 'apocalyptia_session_history';
      const rawData = activeMode === 'local' ? localStorage.getItem(storageKey) : sessionStorage.getItem(storageKey);
      const logs = JSON.parse(rawData) || [];

      const container = $('#history-container');
      container.empty();

      if (logs.length === 0) {
        container.html('<p class="empty-msg">No history recorded yet for this view.</p>');
        return;
      }

      logs.forEach(item => {
        const card = `
          <div class="history-item">
            <div class="history-item-info">
              <h3>${item.title}</h3>
              <div>
                <span class="history-badge">${item.category}</span>
                <span class="history-time">Visited: ${item.timestamp}</span>
              </div>
            </div>
            <a href="${item.url}" class="btn-sm">Revisit</a>
          </div>
        `;
        container.append(card);
      });
    }

    $(document).ready(function() {
      renderHistory();

      $('#btn-local').click(function() {
        activeMode = 'local';
        $(this).removeClass('btn-sm').addClass('btn');
        $('#btn-session').removeClass('btn').addClass('btn-sm');
        renderHistory();
      });

      $('#btn-session').click(function() {
        activeMode = 'session';
        $(this).removeClass('btn-sm').addClass('btn');
        $('#btn-local').removeClass('btn').addClass('btn-sm');
        renderHistory();
      });

      $('#btn-clear').click(function() {
        if (confirm('Clear history for ' + activeMode + ' storage?')) {
          if (activeMode === 'local') {
            localStorage.removeItem('apocalyptia_history');
          } else {
            sessionStorage.removeItem('apocalyptia_session_history');
          }
          renderHistory();
        }
      });
    });
  </script>
</body>
</html>
